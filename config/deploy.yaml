# deploy-engine 部署配置示例（YAML）
# 复制为 deploy.yaml 或 <project>.yaml，-config 指向本文件即可；扩展名 .yaml/.yml 均支持。

deployment_id: my-app-001
provider_name: aliyun

default:
  resource:
    region: cn-hongkong
    instance_type: ecs.u1-c1m4.xlarge
    spot_price_limit: 0.5
    disk_size: 100
    eip_bandwidth: 100
  env:
    # acr_server: registry.cn-hongkong.aliyuncs.com
    # acr_namespace: my-ns
    k3s_version: v1.31.4+k3s1
    # config_file 可选；不填时引擎按 project+env 推导 ConfigRoot 下的 <project>-<env>.yaml 或 default-<env>.yaml
  # deployment:  # 示例：部署 Helm chart（已注释，避免默认部署 nginx）
  #   chart_repo_url: https://charts.bitnami.com/bitnami
  #   chart_name: nginx
  #   release_name: my-release
  #   namespace: default
  #   values:
  #     replicaCount: 1

# user_override:  # 用户覆盖配置（可选）
  # deployment:
  #   release_name: my-release
  #   namespace: default
